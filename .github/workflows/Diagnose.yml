name: Diagnose Mali LSE Atomics

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Mali-Bibliothek auf LSE-Instruktionen prüfen
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    env:
      SYSROOT_LIB: ${{ github.workspace }}/sysroot
      DIAG: ${{ github.workspace }}/diagnose

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: "System-Pakete installieren"
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu \
            file \
            curl \
            ca-certificates

      - name: "Diagnose-Ordner anlegen"
        run: mkdir -p "$DIAG"

      - name: "Alle Mali-Bibliotheken im sysroot finden"
        run: |
          set -e
          {
            echo "=== Sysroot-Inhalt ==="
            ls -la "$SYSROOT_LIB" 2>/dev/null || echo "(kein sysroot)"
            echo ""
            echo "=== Alle .so-Dateien im sysroot ==="
            find "$SYSROOT_LIB" -name "*.so*" -type f 2>/dev/null || echo "(keine)"
            echo ""
            echo "=== Suche nach libGLESv2/libmali/libEGL ==="
            find "$SYSROOT_LIB" -iname "*GLES*" -o -iname "*mali*" -o -iname "*EGL*" 2>/dev/null
          } > "$DIAG/01_sysroot_libs.txt"
          cat "$DIAG/01_sysroot_libs.txt"

      - name: "LSE-Instruktionen in jeder Bibliothek prüfen"
        run: |
          set -e
          {
            echo "=== LSE-Atomics-Prüfung (ldadd, cas, swp, ldclr, etc.) ==="
            echo "Eine Zahl > 0 bedeutet: Die Bibliothek enthält ARMv8.1-LSE-Instruktionen."
            echo "Auf einem Cortex-A35 (ARMv8.0) führt das zu SIGILL."
            echo ""
            for lib in $(find "$SYSROOT_LIB" -name "*.so*" -type f 2>/dev/null); do
              count=$(aarch64-linux-gnu-objdump -d "$lib" 2>/dev/null | \
                grep -iE '\b(cas|casp|swp|ldadd|stadd|ldclr|stclr|ldeor|steor|ldset|stset|ldsmax|stsmax|ldsmin|stsmin|ldumax|stumax|ldumin|stumin)\b' | \
                wc -l)
              if [ "$count" -gt 0 ]; then
                echo "WARNUNG: $lib enthält $count LSE-Instruktionen"
                echo "  Erste 5 Treffer:"
                aarch64-linux-gnu-objdump -d "$lib" 2>/dev/null | \
                  grep -iE '\b(cas|casp|swp|ldadd|stadd|ldclr|stclr|ldeor|steor|ldset|stset|ldsmax|stsmax|ldsmin|stsmin|ldumax|stumax|ldumin|stumin)\b' | \
                  head -5
              else
                echo "OK: $lib enthält keine LSE-Instruktionen"
              fi
            done
          } > "$DIAG/02_lse_check.txt"
          cat "$DIAG/02_lse_check.txt"

      - name: "LSE-Instruktionen in der System-glibc prüfen"
        run: |
          set -e
          {
            echo "=== System-glibc auf LSE prüfen ==="
            for lib in /lib/aarch64-linux-gnu/libc.so.6 /lib/aarch64-linux-gnu/libpthread.so.0; do
              if [ -f "$lib" ]; then
                count=$(aarch64-linux-gnu-objdump -d "$lib" 2>/dev/null | \
                  grep -iE '\b(cas|casp|swp|ldadd|stadd|ldclr|stclr|ldeor|steor|ldset|stset|ldsmax|stsmax|ldsmin|stsmin|ldumax|stumax|ldumin|stumin)\b' | \
                  wc -l)
                echo "$lib: $count LSE-Instruktionen"
              fi
            done
          } > "$DIAG/03_glibc_lse.txt"
          cat "$DIAG/03_glibc_lse.txt"

      - name: "Build-Log auf -mno-outline-atomics prüfen"
        run: |
          set -e
          {
            echo "=== Suche nach -mno-outline-atomics im Build-Log ==="
            if [ -f "build.log" ]; then
              grep -c "mno-outline-atomics" build.log || echo "0 Treffer"
            else
              echo "(kein build.log im Repo-Root)"
            fi
            echo ""
            echo "=== Suche nach -moutline-atomics (falls vorhanden) ==="
            if [ -f "build.log" ]; then
              grep -c "moutline-atomics" build.log || echo "0 Treffer"
            fi
          } > "$DIAG/04_build_flags.txt"
          cat "$DIAG/04_build_flags.txt"

      - name: "Diagnose-Artefakte hochladen"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mali-lse-diagnose
          path: diagnose/
          if-no-files-found: warn
          retention-days: 30
