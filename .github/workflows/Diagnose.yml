name: Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tools installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu file

      - name: Ordner anlegen
        run: mkdir -p diagnose

      - name: Sysroot auflisten
        run: |
          ls -la sysroot/ > diagnose/01_sysroot.txt 2>&1 || echo "(kein sysroot)" > diagnose/01_sysroot.txt
          cat diagnose/01_sysroot.txt

      - name: Dateitypen bestimmen
        run: |
          for f in sysroot/*.so*; do
            if [ -f "$f" ]; then
              file "$f" >> diagnose/02_file.txt
            fi
          done
          cat diagnose/02_file.txt 2>/dev/null || true

      - name: LSE-Instruktionen zaehlen
        run: |
          set +e
          echo "=== LSE-Pruefung (nur echte Instruktionen) ===" > diagnose/03_lse.txt
          for f in sysroot/*.so*; do
            if [ ! -f "$f" ]; then continue; fi
            aarch64-linux-gnu-objdump -d "$f" 2>/dev/null > /tmp/od.txt
            COUNT=0
            while read -r line; do
              case "$line" in
                *ldadd*|*ldclr*|*ldeor*|*ldset*|*ldsmax*|*ldsmin*|*ldumax*|*ldumin*|*stadd*|*stclr*|*steor*|*stset*|*stsmax*|*stsmin*|*stumax*|*stumin*|*swp\ *|*cas\ *|*casp\ *)
                  COUNT=$((COUNT+1))
                  ;;
              esac
            done < /tmp/od.txt
            echo "$(basename $f): $COUNT" >> diagnose/03_lse.txt
          done
          cat diagnose/03_lse.txt

      - name: Detaillierte LSE-Treffer
        run: |
          set +e
          echo "=== Detaillierte LSE-Treffer ===" > diagnose/04_lse_detail.txt
          for f in sysroot/*.so*; do
            if [ ! -f "$f" ]; then continue; fi
            echo "--- $(basename $f) ---" >> diagnose/04_lse_detail.txt
            aarch64-linux-gnu-objdump -d "$f" 2>/dev/null | grep -E "^[[:space:]]+[0-9a-f]+:.*\b(ldadd|ldclr|ldeor|ldset|stadd|stclr|steor|stset|swp|cas|casp)\b" >> diagnose/04_lse_detail.txt
          done
          cat diagnose/04_lse_detail.txt

      - name: Bibliotheksabhaengigkeiten
        run: |
          set +e
          echo "=== NEEDED / SONAME ===" > diagnose/05_needed.txt
          for f in sysroot/*.so*; do
            if [ ! -f "$f" ]; then continue; fi
            echo "--- $(basename $f) ---" >> diagnose/05_needed.txt
            aarch64-linux-gnu-readelf -d "$f" 2>/dev/null | grep -E "NEEDED|SONAME" >> diagnose/05_needed.txt
          done
          cat diagnose/05_needed.txt

      - name: Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose
          path: diagnose/
          if-no-files-found: warn
          retention-days: 30
