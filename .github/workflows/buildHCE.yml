name: Build Halo CE for RK3326

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'
      - 'llms.txt'

jobs:
  build:
    name: Build guest + host (arm64_32 + aarch64)
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    env:
      SYSROOT_LIB: ${{ github.workspace }}/sysroot
      ANDROID_NDK: ${{ github.workspace }}/ndk-r28c
      GUEST_CC: clang-22
      HOST_CC: aarch64-linux-gnu-gcc
      PGO_MODE: use
      JOBS: "4"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: "glibc-Version im Container pruefen"
        run: |
          echo "== glibc im Container:"
          ldd --version 2>/dev/null | head -1 || true
          echo "== Architektur:"
          uname -m

      - name: "System-Pakete installieren (Ubuntu 20.04)"
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            wget \
            tar \
            python3 \
            python3-pip \
            python3-yaml \
            ca-certificates \
            xz-utils \
            unzip \
            pkg-config \
            gnupg \
            lsb-release \
            software-properties-common \
            file \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libstdc++-9-dev-arm64-cross \
            libexpat1-dev \
            zlib1g-dev

      - name: "clang-22 installieren (fuer den Guest)"
        run: |
          set -e
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | apt-key add -
          echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-22 main" \
            > /etc/apt/sources.list.d/llvm-22.list
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-22 lld-22 llvm-22
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang-22
          ln -sf /usr/bin/ld.lld-22 /usr/local/bin/ld.lld-22
          clang-22 --version
          clang-22 -print-targets | grep -q aarch64_32 \
            && echo "OK: arm64_32 target verfuegbar" \
            || { echo "FEHLER: clang-22 hat kein arm64_32-Target"; exit 1; }

      - name: "Host-Compiler pruefen"
        run: |
          set -e
          echo "== aarch64-linux-gnu-gcc Version:"
          aarch64-linux-gnu-gcc --version | head -1
          echo "== Test-Link:"
          printf 'int main(void){return 0;}\n' > /tmp/test.c
          aarch64-linux-gnu-gcc -o /tmp/test /tmp/test.c
          file /tmp/test

      - name: "Python-Pakete installieren"
        run: |
          set -e
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir Pillow numpy scipy

      - name: "Android NDK r28c installieren"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          NDK_ZIP="android-ndk-r28c-linux.zip"
          if [ ! -f "$NDK_ZIP" ]; then
            curl -fL --retry 3 --retry-delay 5 -o "$NDK_ZIP" \
              "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
          fi
          unzip -q "$NDK_ZIP" -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/android-ndk-r28c" "$ANDROID_NDK"
          rm -f "$NDK_ZIP"
          test -d "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK: $ANDROID_NDK"

      - name: "SYSROOT_LIB pruefen und vorbereiten"
        run: |
          set -e
          echo "== SYSROOT_LIB=$SYSROOT_LIB"
          mkdir -p "$SYSROOT_LIB"

          # 1. libdecor-0.so.0 Stub fuer Ubuntu 20.04 (GLIBC 2.31 / ArkOS)
          if [ ! -f "$SYSROOT_LIB/libdecor-0.so.0" ]; then
            echo "== Erzeuge libdecor-0.so.0 Stub fuer ARM64 ..."
            aarch64-linux-gnu-gcc -shared -fPIC -Wl,-soname,libdecor-0.so.0 -o "$SYSROOT_LIB/libdecor-0.so.0" -x c - <<'DECOR_EOF'
void libdecor_new(void) {}
void libdecor_unref(void) {}
DECOR_EOF
          fi

          # 2. libEGL.so.1 Link-Stub falls nicht vorhanden
          if [ ! -f "$SYSROOT_LIB/libEGL.so.1" ]; then
            echo "== Erzeuge libEGL.so.1 Link-Stub fuer ARM64 ..."
            aarch64-linux-gnu-gcc -shared -fPIC -Wl,-soname,libEGL.so.1 -o "$SYSROOT_LIB/libEGL.so.1" -x c - <<'EGL_EOF'
void eglGetCurrentDisplay(void) {}
void eglGetCurrentContext(void) {}
void eglQueryContext(void) {}
void eglChooseConfig(void) {}
void eglCreateContext(void) {}
void eglCreatePbufferSurface(void) {}
void eglMakeCurrent(void) {}
void eglGetError(void) {}
void eglDestroyContext(void) {}
void eglDestroySurface(void) {}
void eglSwapBuffers(void) {}
EGL_EOF
          fi

          # 3. libGLESv2.so.2 Link-Stub falls nicht vorhanden
          if [ ! -f "$SYSROOT_LIB/libGLESv2.so.2" ]; then
            echo "== Erzeuge libGLESv2.so.2 Link-Stub fuer ARM64 ..."
            aarch64-linux-gnu-gcc -shared -fPIC -Wl,-soname,libGLESv2.so.2 -o "$SYSROOT_LIB/libGLESv2.so.2" -x c - <<'GLES_EOF'
void glCreateShader(void) {}
void glShaderSource(void) {}
void glCompileShader(void) {}
void glGetShaderiv(void) {}
void glGetShaderInfoLog(void) {}
void glDeleteShader(void) {}
void glAttachShader(void) {}
void glDetachShader(void) {}
void glLinkProgram(void) {}
void glGetProgramiv(void) {}
void glGetProgramInfoLog(void) {}
void glGetProgramBinary(void) {}
void glProgramParameteri(void) {}
void glFinish(void) {}
void glFlush(void) {}
void glActiveTexture(void) {}
void glGetIntegerv(void) {}
void glGetTexLevelParameteriv(void) {}
void glGetTexParameteriv(void) {}
GLES_EOF
          fi

          echo "== Inhalt von SYSROOT_LIB:"
          ls -la "$SYSROOT_LIB"

      - name: "rej/-Ordner vorbereiten"
        run: mkdir -p rej

      - name: "Build ausfuehren (build.sh)"
        id: build
        run: |
          set -e
          chmod +x build.sh
          bash build.sh 2>&1 | tee build.log

      - name: "Fehleranalyse sammeln"
        if: always()
        run: |
          set +e
          {
            echo "════════════════════════════════════════════════════════════"
            echo "BUILD-FEHLER-ANALYSE"
            echo "════════════════════════════════════════════════════════════"
            echo "Datum: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Repo: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "1. ALLE error:-Zeilen"
            echo "════════════════════════════════════════════════════════════"
            grep -nE "error:|error :|fatal error:|FAILED:" build.log 2>/dev/null | head -500 || echo "(keine error-Zeilen)"
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "2. Letzte 500 Zeilen build.log"
            echo "════════════════════════════════════════════════════════════"
            tail -n 500 build.log 2>/dev/null || echo "(kein build.log)"
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "3. Host-Binary-Info"
            echo "════════════════════════════════════════════════════════════"
            if [ -f dist/halo ]; then
              file dist/halo 2>&1 || true
              ls -la dist/halo
            else
              echo "(dist/halo fehlt)"
            fi
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "4. Verwendeter Compiler"
            echo "════════════════════════════════════════════════════════════"
            grep -E "Compiler|aarch64-linux-gnu-gcc|GCC" build.log 2>/dev/null | head -10 || true
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "ENDE DER FEHLERANALYSE"
            echo "════════════════════════════════════════════════════════════"
          } > build-error-analysis.txt
          cp build-error-analysis.txt rej/ 2>/dev/null || true
          cp build.log rej/ 2>/dev/null || true

      - name: "Upload Konflikt- und Fehleranalyse"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rej-and-error-analysis
          path: |
            rej/
            build-error-analysis.txt
            build.log
          if-no-files-found: warn
          retention-days: 30

      - name: "Upload Build-Ergebnis (bei Erfolg)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: halo-ce-rk3326-build
          path: |
            dist/halo
            dist/halo_guest.elf
            dist/Halo.sh
            dist/halo_extract.py
            dist/halo_screen.py
            dist/sdl_mapping.py
            dist/libs.aarch64/
          if-no-files-found: warn
          retention-days: 30

      - name: "Kurze Zusammenfassung"
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  BUILD-ZUSAMMENFASSUNG"
          echo "════════════════════════════════════════════════════════════"
          if [ -f dist/halo_guest.elf ]; then
            echo "Guest-ELF: $(stat -c%s dist/halo_guest.elf) Bytes"
          else
            echo "Guest-ELF: FEHLT"
          fi
          if [ -f dist/halo ]; then
            echo "Host-Binary: $(stat -c%s dist/halo) Bytes"
          else
            echo "Host-Binary: FEHLT"
          fi
          echo "════════════════════════════════════════════════════════════"
