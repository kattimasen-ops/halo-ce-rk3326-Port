name: Build Halo CE for RK3326

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'
      - 'llms.txt'

permissions:
  contents: write

jobs:
  build:
    name: Build guest + host (arm64_32 + aarch64)
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    env:
      SYSROOT_LIB: ${{ github.workspace }}/sysroot
      ANDROID_NDK: ${{ github.workspace }}/ndk-r28c
      GUEST_CC: clang-22
      HOST_CC: aarch64-linux-gnu-gcc
      PGO_MODE: use
      JOBS: "4"
      DEBIAN_FRONTEND: noninteractive
      PKG_CONFIG_PATH: ${{ github.workspace }}/sysroot/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: "Git Safe Directory"
        run: git config --global --add safe.directory "*" || true

      - name: "glibc-Version im Container pruefen"
        run: |
          echo "== glibc im Container:"
          ldd --version 2>/dev/null | head -1 || true
          echo "== Architektur:"
          uname -m

      - name: "System-Pakete installieren (Ubuntu 20.04)"
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            wget \
            tar \
            python3 \
            python3-pip \
            python3-yaml \
            ca-certificates \
            xz-utils \
            unzip \
            pkg-config \
            gnupg \
            lsb-release \
            software-properties-common \
            file \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libstdc++-9-dev-arm64-cross \
            libexpat1-dev \
            zlib1g-dev \
            libdrm-dev \
            libgbm-dev \
            libudev-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libasound2-dev

      - name: "aarch64-Multiarch: libdrm, libgbm, EGL, GLES, ALSA fuer den SDL-Link bereitstellen"
        run: |
          set -e

          echo "== aarch64 als zweite Architektur aktivieren"
          dpkg --add-architecture arm64

          if [ -f /etc/apt/sources.list ]; then
            cp /etc/apt/sources.list /etc/apt/sources.list.amd64-backup
            sed -i -E 's/^deb (\[[^]]*\] )?http/deb [arch=amd64] http/' /etc/apt/sources.list
          fi

          mkdir -p /etc/apt/sources.list.d
          cat > /etc/apt/sources.list.d/arm64.list << 'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe
          EOF

          apt-get update

          echo "== arm64-Laufzeitbibliotheken installieren"
          apt-get install -y --no-install-recommends \
            libdrm2:arm64 \
            libgbm1:arm64 \
            libwayland-server0:arm64 \
            libexpat1:arm64 \
            libegl1:arm64 \
            libgles2:arm64 \
            libasound2:arm64

          echo "== arm64-Libs in den Cross-Sysroot spiegeln"
          mkdir -p /usr/aarch64-linux-gnu/lib

          for pair in \
              "libdrm.so.2:libdrm.so" \
              "libgbm.so.1:libgbm.so" \
              "libEGL.so.1:libEGL.so" \
              "libGLESv2.so.2:libGLESv2.so" \
              "libasound.so.2:libasound.so"; do
            target="/usr/lib/aarch64-linux-gnu/${pair%%:*}"
            link="/usr/aarch64-linux-gnu/lib/${pair##*:}"
            if [ -e "$target" ]; then
              ln -sf "$target" "$link"
              echo "  $link -> $target"
            else
              echo "  FEHLT: $target"
              exit 1
            fi
          done

          echo "== Cross-Sysroot:"
          ls -la /usr/aarch64-linux-gnu/lib/ || true

          PC_DIR="$SYSROOT_LIB/pkgconfig"
          mkdir -p "$PC_DIR"

          cat > "$PC_DIR/libdrm.pc" << 'PCEOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/aarch64-linux-gnu/lib
          includedir=/usr/include/libdrm

          Name: libdrm
          Description: Userspace interface to kernel DRM services
          Version: 2.4.110
          Libs: -L${libdir} -ldrm
          Cflags: -I${includedir}
          PCEOF

          cat > "$PC_DIR/gbm.pc" << 'PCEOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/aarch64-linux-gnu/lib
          includedir=/usr/include

          Name: gbm
          Description: Graphics Buffer Manager
          Version: 21.2.6
          Libs: -L${libdir} -lgbm
          Cflags: -I${includedir}
          PCEOF

          cat > "$PC_DIR/egl.pc" << 'PCEOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/aarch64-linux-gnu/lib
          includedir=/usr/include

          Name: egl
          Description: EGL library
          Version: 1.5
          Libs: -L${libdir} -lEGL
          Cflags: -I${includedir}
          PCEOF

          cat > "$PC_DIR/glesv2.pc" << 'PCEOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/aarch64-linux-gnu/lib
          includedir=/usr/include
          Name: glesv2
          Description: OpenGL ES v2 library
          Version: 2.0
          Libs: -L${libdir} -lGLESv2
          Cflags: -I${includedir}
          PCEOF

          cat > "$PC_DIR/libudev.pc" << 'PCEOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/aarch64-linux-gnu/lib
          includedir=/usr/include

          Name: libudev
          Description: libudev library
          Version: 245
          Libs: -L${libdir} -ludev
          Cflags: -I${includedir}
          PCEOF

          cat > "$PC_DIR/alsa.pc" << 'PCEOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/aarch64-linux-gnu/lib
          includedir=/usr/include

          Name: alsa
          Description: Advanced Linux Sound Architecture
          Version: 1.2.4
          Libs: -L${libdir} -lasound
          Cflags: -I${includedir}
          PCEOF

          echo "== aarch64 pkg-config-Dateien in $PC_DIR:"
          ls -la "$PC_DIR"

          echo "== pkg-config-Gegenprobe (arm64-Kontext):"
          for m in libdrm gbm egl glesv2 libudev alsa; do
            if pkg-config --exists "$m"; then
              echo "  OK: $m -> $(pkg-config --modversion "$m")"
            else
              echo "  FEHLT: $m"
              exit 1
            fi
          done

      - name: "clang-22 installieren (fuer den Guest)"
        run: |
          set -e
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | apt-key add -
          echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-22 main" \
            > /etc/apt/sources.list.d/llvm-22.list
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-22 lld-22 llvm-22
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang-22
          ln -sf /usr/bin/ld.lld-22 /usr/local/bin/ld.lld-22
          clang-22 --version
          clang-22 -print-targets | grep -q aarch64_32 \
            && echo "OK: arm64_32 target verfuegbar" \
            || { echo "FEHLER: clang-22 hat kein arm64_32-Target"; exit 1; }

      - name: "Host-Compiler pruefen"
        run: |
          set -e
          echo "== aarch64-linux-gnu-gcc Version:"
          aarch64-linux-gnu-gcc --version | head -1
          echo "== Test-Link:"
          printf 'int main(void){return 0;}\n' > /tmp/test.c
          aarch64-linux-gnu-gcc -o /tmp/test /tmp/test.c
          file /tmp/test

      - name: "KMSDRM- und ALSA-Abhaengigkeiten pruefen"
        run: |
          set -e
          echo "== pkg-config fuer SDL2s KMSDRM- und ALSA-Backend:"
          for module in libdrm gbm egl libudev alsa; do
            if pkg-config --exists "$module"; then
              echo "  OK: $module $(pkg-config --modversion "$module" 2>/dev/null || echo '?')"
            else
              echo "  FEHLT: $module"
              exit 1
            fi
          done
          echo ""
          echo "== aarch64-Cross-Bibliotheken:"
          for lib in libdrm.so libgbm.so libEGL.so libGLESv2.so libasound.so; do
            if [ -e "/usr/aarch64-linux-gnu/lib/$lib" ]; then
              echo "  OK: /usr/aarch64-linux-gnu/lib/$lib -> $(readlink -f /usr/aarch64-linux-gnu/lib/$lib)"
            else
              echo "  FEHLT: /usr/aarch64-linux-gnu/lib/$lib"
              exit 1
            fi
          done

      - name: "Python-Pakete installieren"
        run: |
          set -e
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir Pillow numpy scipy

      - name: "Android NDK r28c installieren"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          NDK_ZIP="android-ndk-r28c-linux.zip"
          if [ ! -f "$NDK_ZIP" ]; then
            curl -fL --retry 3 --retry-delay 5 -o "$NDK_ZIP" \
              "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
          fi
          unzip -q "$NDK_ZIP" -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/android-ndk-r28c" "$ANDROID_NDK"
          rm -f "$NDK_ZIP"
          test -d "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK: $ANDROID_NDK"

      - name: "sysroot fuer einen frischen SDL2-Build vorbereiten"
        run: |
          set -e
          mkdir -p "$SYSROOT_LIB"
          echo "== SYSROOT_LIB=$SYSROOT_LIB"
          echo "== Vorher:"
          ls -la "$SYSROOT_LIB" || true

          if [ -f "$SYSROOT_LIB/libSDL2-2.0.so.0" ]; then
            rm -f "$SYSROOT_LIB/libSDL2-2.0.so.0"
            echo "  libSDL2-2.0.so.0 entfernt (wird mit KMSDRM-Pageflip-Patch neu gebaut)"
          fi

          if [ -f "$SYSROOT_LIB/libSDL3.so.0" ]; then
            rm -f "$SYSROOT_LIB/libSDL3.so.0"
            echo "  libSDL3.so.0 entfernt (wird neu gebaut)"
          fi

          echo "== Nachher:"
          ls -la "$SYSROOT_LIB" || true

      - name: "SYSROOT_LIB pruefen"
        run: |
          set -e
          echo "== SYSROOT_LIB=$SYSROOT_LIB"
          mkdir -p "$SYSROOT_LIB"
          ls -la "$SYSROOT_LIB" || true

          for lib in libdecor-0.so.0; do
            if ls "$SYSROOT_LIB/$lib"* > /dev/null 2>&1; then
              echo "  OK: $lib"
            else
              echo "  HINWEIS: $lib fehlt, build.sh erzeugt einen Stub."
            fi
          done
          for lib in libSDL3.so.0 libSDL2-2.0.so.0; do
            if ls "$SYSROOT_LIB/$lib"* > /dev/null 2>&1; then
              echo "  OK: $lib (vorgefertigt)"
            else
              echo "  HINWEIS: $lib fehlt, build.sh baut sie aus dem Quellcode (erwartet)."
            fi
          done

          echo "== pkgconfig-Unterordner:"
          ls -la "$SYSROOT_LIB/pkgconfig" || true

      - name: "rej/-Ordner vorbereiten"
        run: mkdir -p rej

      - name: "Build ausfuehren (build.sh)"
        id: build
        run: |
          set -e
          chmod +x build.sh
          bash build.sh 2>&1 | tee build.log

      - name: "Gepatchte Quelldateien zum Pruefen bereitstellen"
        if: always()
        run: |
          set +e
          WORKSRC=""
          for candidate in \
              "$GITHUB_WORKSPACE/work/halo-ce-universal" \
              "$GITHUB_WORKSPACE/../work/halo-ce-universal"; do
            if [ -d "$candidate" ]; then
              WORKSRC="$candidate"
              break
            fi
          done
          if [ -z "$WORKSRC" ]; then
            WORKSRC=$(find "$GITHUB_WORKSPACE" -maxdepth 5 -type d -name "halo-ce-universal" 2>/dev/null | head -n 1)
          fi
          echo "WORKSRC=$WORKSRC"
          mkdir -p rej/patched
          if [ -n "$WORKSRC" ] && [ -d "$WORKSRC" ]; then
            for f in \
                port/linux/src/d3d8_gl.c \
                port/android/host/host_gl.c \
                port/android/host/host_glthread.c \
                port/android/host/host_loader.c \
                port/linux/src/port_config.c \
                port/linux/src/xbox_textures.c \
                port/linux/src/xgpu.h \
                port/linux/src/gl.h ; do
              if [ -f "$WORKSRC/$f" ]; then
                target="rej/patched/$(echo "$f" | tr / _)"
                cp "$WORKSRC/$f" "$target"
                echo "  kopiert: $f -> $target"
              else
                echo "  fehlt: $f"
              fi
            done
          else
            echo "  WORKSRC nicht gefunden, nichts kopiert"
          fi
          ls -la rej/patched/ 2>/dev/null || true

      - name: "SDL2-Backends und Patches verifizieren"
        if: always()
        run: |
          set +e
          if [ ! -f "$SYSROOT_LIB/libSDL2-2.0.so.0" ]; then
            echo "libSDL2-2.0.so.0 fehlt in sysroot/ - Build hat sie nicht erzeugt."
            exit 0
          fi
          size=$(stat -c%s "$SYSROOT_LIB/libSDL2-2.0.so.0")
          echo "libSDL2-2.0.so.0: $size Bytes"
          echo ""
          if command -v aarch64-linux-gnu-strings > /dev/null 2>&1; then
            echo "== KMSDRM im SDL2-Binary (Strings):"
            if aarch64-linux-gnu-strings "$SYSROOT_LIB/libSDL2-2.0.so.0" | grep -q "KMSDRM"; then
              echo "  OK: KMSDRM ist enthalten"
            else
              echo "  FEHLT: KMSDRM nicht im SDL2-Binary"
            fi
            echo ""
            echo "== ALSA im SDL2-Binary (Strings):"
            if aarch64-linux-gnu-strings "$SYSROOT_LIB/libSDL2-2.0.so.0" | grep -qi "alsa"; then
              echo "  OK: ALSA ist enthalten"
            else
              echo "  FEHLT: ALSA nicht im SDL2-Binary"
            fi
            echo ""
            echo "== Mali-G31-Pageflip-Patch im SDL2-Binary:"
            if aarch64-linux-gnu-strings "$SYSROOT_LIB/libSDL2-2.0.so.0" | grep -q "Async pageflip rejected"; then
              echo "  OK: Pageflip-Patch ist kompiliert"
            else
              echo "  FEHLT: Pageflip-Patch nicht im Binary"
            fi
          fi
          echo ""
          echo "== SDL2 dynamisch benoetigte Bibliotheken:"
          if command -v aarch64-linux-gnu-readelf > /dev/null 2>&1; then
            aarch64-linux-gnu-readelf -d "$SYSROOT_LIB/libSDL2-2.0.so.0" | grep NEEDED || true
          fi

      - name: "Host-Binary: libmali.so.0 und libasound.so.2 in NEEDED verifizieren"
        if: always()
        run: |
          set +e
          if [ ! -f dist/halo ]; then
            echo "dist/halo fehlt - Build ist nicht bis zum Host-Link gekommen."
            exit 0
          fi
          echo "== NEEDED-Eintraege in dist/halo:"
          if command -v aarch64-linux-gnu-readelf > /dev/null 2>&1; then
            aarch64-linux-gnu-readelf -d dist/halo | grep NEEDED || true
            echo ""
            if aarch64-linux-gnu-readelf -d dist/halo | grep -q "libmali.so.0"; then
              echo "  OK: libmali.so.0 ist in NEEDED"
            else
              echo "  FEHLER: libmali.so.0 fehlt in NEEDED"
            fi
            if aarch64-linux-gnu-readelf -d dist/halo | grep -q "libasound.so.2"; then
              echo "  OK: libasound.so.2 ist in NEEDED"
            else
              echo "  HINWEIS: libasound.so.2 fehlt in NEEDED (SDL2 laedt ALSA via dlopen oder linkt direkt)"
            fi
          else
            echo "  (readelf nicht verfuegbar)"
          fi

      - name: "Fehleranalyse sammeln"
        if: always()
        run: |
          set +e
          {
            echo "================================================================"
            echo "BUILD-FEHLER-ANALYSE"
            echo "================================================================"
            echo "Datum: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Repo: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "================================================================"
            echo "1. ALLE error:-Zeilen"
            echo "================================================================"
            grep -nE "error:|error :|fatal error:|FAILED:" build.log 2>/dev/null | head -500 || echo "(keine error-Zeilen)"
            echo ""
            echo "================================================================"
            echo "2. Letzte 500 Zeilen build.log"
            echo "================================================================"
            tail -n 500 build.log 2>/dev/null || echo "(kein build.log)"
            echo ""
            echo "================================================================"
            echo "3. Host-Binary-Info"
            echo "================================================================"
            if [ -f dist/halo ]; then
              file dist/halo 2>&1 || true
              ls -la dist/halo
              if command -v aarch64-linux-gnu-readelf > /dev/null 2>&1; then
                echo "--- NEEDED ---"
                aarch64-linux-gnu-readelf -d dist/halo | grep NEEDED || true
              fi
            else
              echo "(dist/halo fehlt)"
            fi
            echo ""
            echo "================================================================"
            echo "4. Verwendeter Compiler"
            echo "================================================================"
            grep -E "Compiler|aarch64-linux-gnu-gcc|GCC" build.log 2>/dev/null | head -10 || true
            echo ""
            echo "================================================================"
            echo "5. SDL2-Backends und Patches"
            echo "================================================================"
            if [ -f "$SYSROOT_LIB/libSDL2-2.0.so.0" ]; then
              echo "libSDL2-2.0.so.0: $(stat -c%s "$SYSROOT_LIB/libSDL2-2.0.so.0") Bytes"
              if command -v aarch64-linux-gnu-strings > /dev/null 2>&1; then
                aarch64-linux-gnu-strings "$SYSROOT_LIB/libSDL2-2.0.so.0" | grep -i "kmsdrm" | head -5 || echo "  (kein KMSDRM-String)"
                aarch64-linux-gnu-strings "$SYSROOT_LIB/libSDL2-2.0.so.0" | grep -i "alsa" | head -5 || echo "  (kein ALSA-String)"
                aarch64-linux-gnu-strings "$SYSROOT_LIB/libSDL2-2.0.so.0" | grep "Async pageflip rejected" | head -1 || echo "  (kein Pageflip-Patch-String)"
              fi
            else
              echo "(libSDL2-2.0.so.0 fehlt)"
            fi
            echo ""
            echo "================================================================"
            echo "6. pkg-config-Dateien im sysroot"
            echo "================================================================"
            ls -la "$SYSROOT_LIB/pkgconfig" 2>/dev/null || echo "(kein pkgconfig-Ordner)"
            echo ""
            echo "================================================================"
            echo "ENDE DER FEHLERANALYSE"
            echo "================================================================"
          } > build-error-analysis.txt
          cp build-error-analysis.txt rej/ 2>/dev/null || true
          cp build.log rej/ 2>/dev/null || true

      - name: "Upload Konflikt- und Fehleranalyse"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rej-and-error-analysis
          path: |
            rej/
            build-error-analysis.txt
            build.log
          if-no-files-found: warn
          retention-days: 30

      - name: "Upload Build-Ergebnis (bei Erfolg)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: halo-ce-rk3326-build
          path: |
            dist/halo
            dist/halo_guest.elf
            dist/Halo.sh
            dist/halo_extract.py
            dist/halo_screen.py
            dist/sdl_mapping.py
            dist/libs.aarch64/
          if-no-files-found: warn
          retention-days: 30

      - name: "Kurze Zusammenfassung"
        if: always()
        run: |
          echo "================================================================"
          echo "  BUILD-ZUSAMMENFASSUNG"
          echo "================================================================"
          if [ -f dist/halo_guest.elf ]; then
            echo "Guest-ELF: $(stat -c%s dist/halo_guest.elf) Bytes"
          else
            echo "Guest-ELF: FEHLT"
          fi
          if [ -f dist/halo ]; then
            echo "Host-Binary: $(stat -c%s dist/halo) Bytes"
          else
            echo "Host-Binary: FEHLT"
          fi
          if [ -f dist/libs.aarch64/libSDL2-2.0.so.0 ]; then
            echo "libSDL2-2.0.so.0: $(stat -c%s dist/libs.aarch64/libSDL2-2.0.so.0) Bytes"
          fi
          echo "================================================================"
